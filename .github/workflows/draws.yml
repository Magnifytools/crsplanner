name: Update Express Entry draws
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; IRCC publishes rounds on weekdays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/draws.mjs --fetch
      - name: Ontario (OINP) invitations
        run: node scripts/oinp.mjs --fetch
        continue-on-error: true
      - name: Manitoba (MPNP) draws
        run: node scripts/mpnp.mjs --fetch
        continue-on-error: true
      - name: Alberta (AAIP) draws
        run: node scripts/aaip.mjs --fetch
        continue-on-error: true
      - name: British Columbia (BC PNP) invitations
        run: node scripts/bcpnp.mjs --fetch
        continue-on-error: true
      - name: New Brunswick (NBPNP and AIP) rounds
        run: node scripts/nbpnp.mjs --fetch
        continue-on-error: true
      - name: Nova Scotia (NSNP) EOI selections
        run: node scripts/nsnp.mjs --fetch
        continue-on-error: true
      - run: npm test
      - name: Commit if the data changed
        run: |
          git config user.name "crsplanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/draws.json data/archive data/provinces
          if git diff --cached --quiet -- data/draws.json data/provinces; then
            echo "No new round or distribution"; git reset -q
          else
            git commit -m "Draws: update from IRCC $(date -u +%F)" && git push
          fi
