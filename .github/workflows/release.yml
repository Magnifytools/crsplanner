name: Release scheduled pages
on:
  schedule:
    - cron: "41 10 * * *"   # daily, 06:41 in Toronto (EDT)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/release.mjs
      - run: npm test && npm run build
      - name: Commit if a page went live
        run: |
          git config user.name "crsplanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/released.json
          if git diff --cached --quiet; then
            echo "Nothing to release"
          else
            git commit -m "Release scheduled pages $(date -u +%F)" && git pull --rebase -q && git push
          fi
